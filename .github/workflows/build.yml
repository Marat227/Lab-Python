
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SodiumFlowNext --collect-all pyqtgraph --collect-all PySide6 --hidden-import scipy.signal run.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SodiumFlowNext-Windows
          path: dist/SodiumFlowNext.exe

